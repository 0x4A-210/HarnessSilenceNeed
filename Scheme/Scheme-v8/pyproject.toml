[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-scheme-v8"
version = "8.0.0"
description = "Standalone diff-driven dual-module harness maintenance analysis"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "tree-sitter==0.25.2", "tree-sitter-c==0.24.2", "tree-sitter-cpp==0.23.4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
scheme-v8 = "scheme_v8.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scheme_v8 = ["llm/attribution/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
