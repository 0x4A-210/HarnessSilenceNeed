workspace: workspace
analysis_scope: change_related
whole_budget:
  max_files: 160
  max_lines: 60000
  max_depth: 2
  seconds: 7200
  max_llm_calls: 64
  max_llm_input_tokens: 8000000
  max_index_bytes: 536870912
  max_file_bytes: 16777216
  max_diff_bytes: 134217728
llm:
  enabled: true
  engine: cascade_session
  obligation_policy: split_coverage_compatibility
  provider: codex_cli
  model: gpt-6-sol
  reasoning_effort: high
  timeout_seconds: 600
  capacity_retries: 1
  transient_retries: 3
  cascade_review: fork
  cascade_extra_rounds: 1
  cascade_new_candidate_rounds: 1
  cascade_citation_repair: true
  program_facts: true
  function_reading: whole
  unlimited_chars: true
  request_max_chars: 950000
  request_pack_chars: 750000
  function_window_lines: 160
  balanced_packet_chars: 650000
  diff_packet_ceiling_chars: 700000
  diff_page_chars: 16000
  diff_context_reserve_chars: 100000
  balanced_max_symbols: 16
  balanced_max_callees: 6
  whole_temporal_packet_chars: 750000
  whole_review_rounds: 3
  whole_symbol_definitions: 8
  whole_declaration_files: 6
  function_page_lines: 250
  diff_max_caller_functions: 40
batch:
  concurrency: 6
extensions:
  attribution: false
  dynamic: false
